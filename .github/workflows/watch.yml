name: 新物件通知

on:
  schedule:
    - cron: '*/10 0-15 * * *'   # 只在台灣時間 8:00~23:59 啟動（GitHub 用 UTC 時間）
  workflow_dispatch:
    inputs:
      test:
        description: '測試：把各區最新 2 筆傳到 Discord'
        type: boolean
        default: false

permissions:
  contents: write

# 同時只跑一個；下一次排程會排隊，等這次結束後立刻接手
concurrency:
  group: house-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 130   # 每次執行內部循環約 110 分鐘，每 10 分鐘檢查一次
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 設定 Git
        run: |
          git config user.name "house-watch-bot"
          git config user.email "house-watch-bot@users.noreply.github.com"

      - name: 檢查新物件（循環）
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_SEND: ${{ inputs.test }}
        run: node watch.js

      - name: 補存最後的紀錄
        if: ${{ always() && inputs.test != true }}
        run: |
          git add state.json
          if git diff --cached --quiet; then
            echo "沒有變化"
          else
            git commit -m "更新物件紀錄"
            git pull --rebase
            git push
          fi
