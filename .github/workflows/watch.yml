name: 新物件通知

on:
  schedule:
    - cron: '*/10 * * * *'   # 每 10 分鐘（GitHub 可能延遲幾分鐘）
  workflow_dispatch:
    inputs:
      test:
        description: '測試：把各區最新 3 筆傳到 Discord'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: house-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 檢查新物件
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_SEND: ${{ inputs.test }}
        run: node watch.js

      - name: 儲存已看過的物件
        if: ${{ inputs.test != true }}
        run: |
          git config user.name "house-watch-bot"
          git config user.email "house-watch-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "沒有變化"
          else
            git commit -m "更新物件紀錄"
            git pull --rebase
            git push
          fi
